name: Ponder Source browser checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_PATH: /
          NODE_OPTIONS: --max-old-space-size=4096
      - run: npm install --prefix acceptance --no-package-lock
      - run: npx --prefix acceptance playwright install --with-deps chromium
      - run: npm --prefix acceptance test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mashlib-playwright-results
          path: acceptance/test-results/
